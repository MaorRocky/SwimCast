<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: http: data:; style-src 'self'; script-src 'self'; connect-src 'none'" />
  <title>SwimCast</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand drag">
        <svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="currentColor" opacity=".14"/><path d="M5 19c2.2 0 2.2-1.6 4.4-1.6S11.6 19 13.8 19s2.2-1.6 4.4-1.6S20.4 19 22.6 19s2.2-1.6 4.4-1.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M5 23.5c2.2 0 2.2-1.6 4.4-1.6s2.2 1.6 4.4 1.6 2.2-1.6 4.4-1.6 2.2 1.6 4.4 1.6 2.2-1.6 4.4-1.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity=".55"/><circle cx="19.5" cy="10.5" r="3" fill="currentColor"/></svg>
        <span>SwimCast</span>
      </div>
      <div class="side-actions">
        <button class="btn btn-ghost-light" id="btn-add" title="Find or add a podcast"><span data-icon="plus"></span>Add podcast</button>
        <button class="btn btn-ghost-light" id="btn-import" title="Import your Apple Podcasts subscriptions"><span data-icon="import"></span>Import</button>
      </div>
      <nav class="side-nav">
        <div class="nav-heading">Library</div>
        <button class="nav-item" id="nav-library"><span data-icon="grid"></span><span class="nav-label">Podcasts</span><span class="count" id="podcast-count"></span></button>
        <button class="nav-item" id="nav-latest"><span data-icon="clock"></span><span class="nav-label">Latest episodes</span></button>
        <button class="nav-item" id="nav-downloads"><span data-icon="check"></span><span class="nav-label">Downloaded</span><span class="count" id="downloaded-count"></span></button>
      </nav>
      <div class="side-spacer"></div>
      <div class="side-footer">
        <div class="dl-status" id="dl-status" hidden></div>
        <button class="btn btn-primary btn-block" id="btn-device"><span data-icon="headphones"></span>Copy to headphones</button>
        <button class="btn btn-icon-light" id="btn-settings" title="Settings" aria-label="Settings"><span data-icon="gear"></span></button>
      </div>
    </aside>
    <main class="main" id="main"></main>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
